AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MBF Cost Dashboard - painel de custos por conta/cliente (Cost Explorer + margem)

Parameters:
  Stage:
    Type: String
    Default: prod
  MarginMap:
    Type: String
    Default: '{"default":1.0}'
    Description: >-
      JSON com multiplicador de margem por accountId.
      Ex: {"532404260870":1.5,"default":1.0}

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 120
    MemorySize: 512
    Tracing: Active

Resources:
  EmailsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mbf-${Stage}-aws-emails'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: messageId
          AttributeType: S
      KeySchema:
        - AttributeName: messageId
          KeyType: HASH

  CostDashboardApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Access-Token
        MaxAge: 86400

  CostDashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'mbf-${Stage}-cost-dashboard'
      Handler: src/handler.handler
      CodeUri: .
      Environment:
        Variables:
          STAGE: !Ref Stage
          MARGIN_MAP: !Ref MarginMap
          SSM_PREFIX: !Sub '/mbf/${Stage}/cost-dashboard'
          EMAILS_TABLE: !Sub 'mbf-${Stage}-aws-emails'
          BEDROCK_MODEL_ID: us.anthropic.claude-haiku-4-5-20251001-v1:0
          SCAN_RULE_NAME: !Sub 'mbf-cost-dashboard-scan-${Stage}'
          SELF_FUNCTION_NAME: !Sub 'mbf-${Stage}-cost-dashboard'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ce:GetCostAndUsage
              Resource: '*'
            - Effect: Allow
              Action:
                - organizations:ListAccounts
              Resource: '*'
            - Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:PutParameter
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mbf/${Stage}/cost-dashboard'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mbf/${Stage}/cost-dashboard/*'
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
                - 'arn:aws:bedrock:*::foundation-model/anthropic.*'
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt EmailsTable.Arn
            - Effect: Allow
              Action:
                - events:PutRule
                - events:DescribeRule
              Resource:
                - !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/mbf-cost-dashboard-scan-${Stage}'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:mbf-${Stage}-cost-dashboard'
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref CostDashboardApi
            Path: /
            Method: GET
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CostDashboardApi
            Path: /{proxy+}
            Method: ANY
        HourlyScan:
          Type: Schedule
          Properties:
            Name: !Sub 'mbf-cost-dashboard-scan-${Stage}'
            Schedule: rate(1 hour)
            Input: '{"source":"scheduled-scan"}'

Outputs:
  DashboardUrl:
    Description: URL do painel de custos
    Value: !Sub 'https://${CostDashboardApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/'
