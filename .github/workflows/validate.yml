name: Validate Cost Dashboard PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'template.yaml'
      - 'samconfig.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

concurrency:
  group: cost-dashboard-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and SAM validate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Run tests
        run: node --test
      - uses: aws-actions/setup-sam@v2
      - name: Validate SAM
        run: sam validate --lint
