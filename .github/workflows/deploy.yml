name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'template.yaml'
      - 'samconfig.toml'
      - '.deploy/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cost-dashboard
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: mbf-cost-dashboard
  SAM_BUCKET: mbf-sam-deploy-us-east-1
  API_BASE_URL: https://sx35x2e9pd.execute-api.us-east-1.amazonaws.com/prod

jobs:
  deploy:
    name: Validate, deploy and smoke-test
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # package-lock.json is out of sync with package.json.
        # Reconcile and commit lockfile before changing this to npm ci.
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Run tests
        run: node --test

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::975877354440:role/mbf-cost-dashboard-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '975877354440'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate --lint

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: >-
          sam deploy
          --stack-name "$STACK_NAME"
          --region "$AWS_REGION"
          --s3-bucket "$SAM_BUCKET"
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides file://.deploy/params.yaml

      - name: Smoke test — API health and login
        run: |
          set -euo pipefail
          for endpoint in health login; do
            status=$(curl --retry 4 --retry-delay 3 --retry-all-errors -s -o /dev/null -w '%{http_code}' "$API_BASE_URL/$endpoint")
            if [[ "$status" != 200 ]]; then
              echo "::error::$endpoint returned HTTP $status"
              exit 1
            fi
            echo "$endpoint: HTTP $status"
          done
          echo "Cost dashboard smoke test OK" >> "$GITHUB_STEP_SUMMARY"
